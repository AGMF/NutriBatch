<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NutriBatch</title>
    <meta name="description" content="Aplicação web para planejamento de marmitas e calibração de macronutrientes. Oferece recálculo automático de porções, consolidação da lista de compras e cronograma paralelo de preparo.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net 'sha256-v3mvQZxymjBuNvGIp7QOMT4sboDaSC1kxGBgkncOdgQ='; style-src 'self'; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net;">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="css/main.css" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "i18next": "https://cdn.jsdelivr.net/npm/i18next@26.7.1/dist/esm/i18next.js",
                "i18nextChainedBackend": "https://cdn.jsdelivr.net/npm/i18next-chained-backend@5.0.8/+esm",
                "i18nextHttpBackend": "https://cdn.jsdelivr.net/npm/i18next-http-backend@4.0.9/+esm",
                "i18nextLanguageDetector": "https://cdn.jsdelivr.net/npm/i18next-browser-languagedetector@8.3.0/+esm",
                "i18nextLocalstorageBackend": "https://cdn.jsdelivr.net/npm/i18next-localstorage-backend@4.3.3/+esm",
                "i18nextVue": "https://cdn.jsdelivr.net/npm/i18next-vue@5.4.0/+esm",
                "supabase": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm",
                "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.esm-browser.js"
            }
        }
    </script>
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/i18next@26.7.1/dist/esm/i18next.js" integrity="sha256-RXd9x70AuagzSPnpGw2AGhaQ7nSrHeKvQf+UJrYos/c=" crossorigin="anonymous">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/i18next-chained-backend@5.0.8/+esm" integrity="sha256-+5oOX9My9OCCM4iKEhpbfV2zQphixFKJfQ1Jt3NPWso=" crossorigin="anonymous">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/i18next-http-backend@4.0.9/+esm" integrity="sha256-4S0+iG76Dyh4hCEvlJMvJTl6JfVfi+E2xI4JxLDj4L4=" crossorigin="anonymous">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/i18next-browser-languagedetector@8.3.0/+esm" integrity="sha256-j7SJiL84L6+3P56IAr4nifUeUqaWEo2d0dx5ZKjS7l0=" crossorigin="anonymous">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/i18next-localstorage-backend@4.3.3/+esm" integrity="sha256-wrTM1GDJLv9s+eUkhYRMIGPt29yAtSGljwhxhhwRCMM=" crossorigin="anonymous">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/i18next-vue@5.4.0/+esm" integrity="sha256-yExxl9iFJPqLIxEJoD0b55iDhBSqmpUzWI8QkFA3iaA=" crossorigin="anonymous">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm" integrity="sha256-vkmw8G3SwzNRQdlb+VESCj0uU4nUAfyYsu6DmqhdCWQ=" crossorigin="anonymous">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.esm-browser.js" integrity="sha256-I8UafPIFjjuffE6jBbfFn6G9Os+5i1wjcf++3d1oHB8=" crossorigin="anonymous">
    <script src="src/main.js" type="module"></script>
</head>
<body>
    <div id="app" v-cloak>
        <header>
            <h1><a href="/">NutriBatch</a></h1>
            <nav>
                <button v-for="locale in getSupportedLocales()" :key="locale" type="button" :disabled="currentLocale === locale" @click="setLocale(locale)">{{ locale }}</button>
            </nav>
        </header>

        <main>
            <section>
                <h2>{{ $t('ui:filters.title') }}</h2>
                <form @submit.prevent>
                    <fieldset>
                        <legend>{{ $t('ui:categories.title') }}</legend>

                        <p v-if="loadingCategories">{{ $t('ui:categories.loading') }}</p>
                        <p v-else-if="categories.length === 0">{{ $t('ui:categories.none_found') }}</p>

                        <template v-else>
                            <div v-for="category in categories" :key="category.id">
                                <label>
                                    <input type="checkbox" :value="category.id" v-model="selectedCategoryIds"/>
                                    {{ $t(`categories:${category.code_key}`) }}
                                </label>
                            </div>

                            <br />
                            <button type="button" @click="clearFilters" :disabled="selectedCategoryIds.length === 0">{{ $t('ui:filters.clear') }}</button>
                        </template>
                    </fieldset>
                </form>
            </section>

            <section>
                <h2>{{ $t('ui:results.title') }}</h2>

                 <div v-if="errorMessage" role="alert">
                    <p>{{ $t('ui:results.error', { error: errorMessage }) }}</p>
                    <button type="button" @click="resetAndFetch">{{ $t('ui:actions.retry') }}</button>
                 </div>

                 <template v-else>
                    <p v-if="totalCount !== null">
                        <output>{{ totalCount }}</output> {{ $t('ui:results.found', { count: totalCount }) }}
                    </p>

                    <p v-if="!loading && items.length === 0">{{ $t('ui:results.none_found') }}</p>

                    <div v-else>
                        <article v-for="item in items" :key="item.id">
                            <h3>{{ $t(`recipes:${item.name_key}`) }}</h3>

                            <div>
                                <strong>{{ $t('ui:categories.title') }}:</strong>
                                <template v-if="item.recipe_categories && item.recipe_categories.length > 0">
                                    <button v-for="rc in item.recipe_categories" :key="rc.categories?.id" type="button" :aria-pressed="selectedCategoryIds.includes(rc.categories?.id)" @click="toggleCategoryFilter(rc.categories?.id)">
                                        {{ $t(`categories:${rc.categories?.code_key}`) }}
                                    </button>
                                </template>
                                <span v-else>{{ $t('ui:categories.none_assigned') }}</span>
                            </div>
                            <p>{{ $t(`recipes:${item.description_key}`) }}</p>
                            <p><strong>{{ $t('ui:recipe.yield_label') }}</strong> {{ item.yield_factor }}x</p>
                        </article>
                    </div>

                    <div ref="sentinel">
                        <p v-if="loading" role="status" aria-busy="true">{{ $t('ui:results.loading_more') }}</p>
                        <p v-else-if="!hasMore && items.length > 0">{{ $t('ui:results.end') }}</p>
                    </div>
                 </template>
            </section>
        </main>
    </div>
    <noscript>
        <p role="alert">O NutriBatch precisa do JavaScript habilitado para funcionar corretamente.</p>
    </noscript>
</body>
</html>
