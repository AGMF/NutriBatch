name: Code Quality (Biome)

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTO_COMMIT_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome Auto-Fix
        run: biome check --write --no-errors-on-unmatched

      - name: Auto-commit formatted changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: formatação automática do Biome [skip ci]"
          branch: ${{ github.ref_name }}
